    Experience:
      - company: Tsinghua University, Internet Architecture Laboratory and CNPT Laboratory
        position: Graduate Research Assistant, DeepShield Project
        location: Beijing, China
        start_date: 2023-09
        end_date: present
        highlights:
          - Designed and developed an Internet-wide SSL/TLS certificate database integrating approximately 70 million actively scanned certificates and 1.1 billion Certificate Transparency log certificates into a unified measurement and analysis platform.
          - Built certificate–asset relationship graphs and security-analysis capabilities for certificate content analysis, forged-certificate detection, and tens of millions of SSL/TLS certificate asset profiles.
          - Identified a cache-related vulnerability in the ACME certificate issuance protocol and developed the ACME cache-reuse attack.
          - Validated the attack's impact in the Let's Encrypt production environment; this work led to the ACME++ publication at WWW 2025.

      - company: University of Illinois Urbana-Champaign, Department of Electrical and Computer Engineering
        position: Senior Thesis Researcher, ECE 496/499
        location: Urbana, IL, USA
        start_date: 2022-10
        end_date: 2023-04
        highlights:
          - Developed an approach for localizing errors in LC-3 programming assignments by grouping student solutions according to their structural design patterns.
          - Represented program structure using simplified control-flow graphs and investigated automated graph comparison to identify the design approach behind an incorrect solution.
          - Explored approach-aware feedback generation to support instruction and debugging in the ECE 220 course.

