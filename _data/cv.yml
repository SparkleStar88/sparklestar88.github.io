    Research Interests:
      - bullet: My research focuses on Internet measurement and cyberspace situational awareness, with an emphasis on Web PKI observability. I build Internet-wide measurement and analysis tools for SSL/TLS certificates and study security issues in certificate issuance, such as certificate misissuance in the ACME protocol.

